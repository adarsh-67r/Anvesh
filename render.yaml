# SIH26101 edition (main). Reuses the existing "anvesh-api" Render service; set its branch to main.
# Create with Render -> New -> Blueprint -> this repo, branch main.
services:
  - type: web
    name: anvesh-api
    runtime: python
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

  - type: web
    name: anvesh-karmayogi
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npx expo export -p web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://anvesh-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
