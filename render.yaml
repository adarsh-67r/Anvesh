# SIH26101 edition (branch ps-26101). The original edition's API ("anvesh-api") is defined on master.
# Create with Render -> New -> Blueprint -> this repo, branch ps-26101.
services:
  - type: web
    name: anvesh-karmayogi-api
    runtime: python
    branch: ps-26101
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

  - type: web
    name: anvesh-karmayogi
    runtime: static
    branch: ps-26101
    rootDir: frontend
    buildCommand: npm ci && npx expo export -p web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://anvesh-karmayogi-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
